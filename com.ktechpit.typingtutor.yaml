app-id: com.ktechpit.typingtutor
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: typingtutor
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --env=INSTALL_TYPE=flatpak

modules:
  - shared-modules/squashfs-tools/squashfs-tools.json

  - name: typingtutor
    buildsystem: simple
    build-commands:
      - unsquashfs -no-progress *.snap
      - install -Dm755 squashfs-root/usr/bin/typingtutor ${FLATPAK_DEST}/bin/typingtutor
      - cp -r squashfs-root/usr/share/icons ${FLATPAK_DEST}/share/
      - install -Dm644 squashfs-root/usr/share/applications/com.ktechpit.typingtutor.desktop ${FLATPAK_DEST}/share/applications/com.ktechpit.typingtutor.desktop
      - desktop-file-edit --set-icon=${FLATPAK_ID} ${FLATPAK_DEST}/share/applications/com.ktechpit.typingtutor.desktop
      - install -Dm644 squashfs-root/usr/share/metainfo/com.ktechpit.typingtutor.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.ktechpit.typingtutor.metainfo.xml
    sources:
      # =========================
      # x86_64 (amd64) — stable
      # =========================
      - type: file
        url: https://api.snapcraft.io/api/v1/snaps/download/FL8sw2ZW4ABBp75yH5pFTdUaLlfWEo3r_5.snap
        sha256: de745749a3933b8afab81958d42cb1b570cf05831662d6ccf19feb1163488075
        only-arches:
          - x86_64

      # =========================
      # aarch64 – stable
      # =========================
      - type: file
        url: https://api.snapcraft.io/api/v1/snaps/download/FL8sw2ZW4ABBp75yH5pFTdUaLlfWEo3r_6.snap
        sha256: af28b43d58703bf22a75f12fd851bff4c7e7c4da2c40263f3931e30ded7987cc
        only-arches:
          - aarch64
